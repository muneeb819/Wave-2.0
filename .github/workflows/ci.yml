name: Wave 2.0 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-backend-and-agent:
    name: Python Backend, Agent & Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev --python 3.13

      - name: Lint & format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable

      - name: Run Python API & Agent tests
        run: uv run pytest -q

      - name: Run coverage
        run: uv run pytest --cov=backend --cov-fail-under=60

  web-and-node-agent:
    name: Web Studio, Token Interop & Node.js Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + livekit-api (for WebCrypto <-> Python TokenVerifier test)
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.13 & sync backend deps
        run: |
          uv python install 3.13
          uv sync --dev --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & test Web Studio
        env:
          # Lets tests/pythonRunner.ts use the interpreter that has `livekit` installed.
          VITEST_PYTHON_BIN: python
        run: |
          pnpm install
          pnpm audit --audit-level=high
          pnpm run lint
          pnpm run test:dom
          pnpm run build

      - name: Run coverage
        env:
          VITEST_PYTHON_BIN: python
        run: pnpm vitest run --coverage

      - name: Install, test & typecheck Node.js Agent
        working-directory: agent-node
        run: |
          pnpm install
          pnpm audit --audit-level=high
          pnpm test
          pnpm build

  security-scan:
    name: Dedicated Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.13 & audit dependencies
        run: |
          uv python install 3.13
          uv sync --dev --python 3.13
          uv run pip-audit --skip-editable
          uv run pytest tests/test_security.py -q --no-cov

      - name: Setup pnpm & Node.js 22
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Audit Web & Node.js Agent lockfiles
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
          pnpm --dir agent-node install --frozen-lockfile
          pnpm --dir agent-node audit --audit-level=high
