name: Wave 2.0 CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.13 (for WebCrypto <-> LiveKit TokenVerifier interop)
        uses: astral-sh/setup-uv@v5

      - name: Sync Python interop dependencies
        run: |
          uv python install 3.13
          uv sync --dev --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend with ESLint
        run: pnpm exec eslint --max-warnings 0 src tests

      - name: Typecheck frontend with TypeScript
        run: pnpm exec tsc --noEmit

      - name: Run frontend unit tests
        env:
          VITEST_PYTHON_BIN: python
        run: pnpm test

      - name: Run frontend coverage check
        env:
          VITEST_PYTHON_BIN: python
        run: pnpm exec vitest run --coverage

      - name: Build production frontend bundle
        run: pnpm run build

      - name: Install, typecheck & test Node.js Agent
        working-directory: agent-node
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test

  backend:
    name: Python Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13 & install dependencies
        run: |
          uv python install 3.13
          uv sync --dev --python 3.13

      - name: Lint backend with Ruff
        run: uv run ruff check .

      - name: Check Python formatting with Ruff
        run: uv run ruff format --check .

      - name: Typecheck backend with Pyright
        run: uv run pyright backend

      - name: Run backend tests and coverage
        run: uv run pytest --cov=backend --cov-fail-under=80

  security-scan:
    name: Dedicated Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Audit Python dependencies & run security suite
        run: |
          uv python install 3.13
          uv sync --dev --python 3.13
          uv run pip-audit --skip-editable
          uv run pytest tests/test_security.py -q --no-cov

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Audit Web & Node.js Agent lockfiles
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
          pnpm --dir agent-node install --frozen-lockfile
          pnpm --dir agent-node audit --audit-level=high
